<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Terrenos — São Paulo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="estilo.css?v=20251125b">
</head>
<body>
<div id="app">
  <div id="mapa"></div>

  <aside id="painel">
    <header>
      <span class="logo" aria-hidden="true"></span>
      <div class="marca">
        <h1>Radar de Terrenos</h1>
        <p id="subtitulo">carregando…</p>
      </div>
      <nav id="abas" role="tablist">
        <button role="tab" data-aba="lista" class="ativa" type="button">Lista</button>
        <button role="tab" data-aba="filtros" type="button">Filtros</button>
      </nav>
    </header>

    <section id="aba-lista" class="aba">
      <div class="topo-lista">
        <input id="busca" type="search" placeholder="Buscar rua, distrito ou quadra" autocomplete="off">
        <details id="zonas-caixa">
          <summary><span id="zonas-resumo"></span></summary>
          <div id="zonas-lista"></div>
          <button id="zonas-padrao" class="link" type="button">Voltar ao padrão</button>
        </details>
        <div class="legenda" id="legenda"></div>
        <div class="barra-lista">
          <span id="contagem">—</span>
          <select id="ordem" aria-label="Ordenar">
            <option value="area">Maior área</option>
            <option value="forma">Melhor forma</option>
            <option value="lote">Menos donos</option>
            <option value="metro">Perto do metrô</option>
          </select>
        </div>
      </div>
      <ol id="lista"></ol>
      <footer class="pe-lista">
        <label class="chave"><input type="checkbox" id="so-tela" checked><span></span>Só o que está na tela</label>
        <button id="btn-csv" class="link" type="button">Exportar CSV</button>
      </footer>
    </section>

    <section id="aba-filtros" class="aba" hidden>
      <h2>Manchas</h2>
      <label class="campo"><span>Área mínima</span><output id="o-area"></output>
        <input type="range" id="f-area" min="2500" max="15000" step="250" value="2500"></label>
      <label class="campo"><span>Forma mínima</span><output id="o-forma"></output>
        <input type="range" id="f-forma" min="0" max="100" step="5" value="0"></label>
      <label class="campo"><span>Máximo de lotes</span><output id="o-nmax"></output>
        <input type="range" id="f-nmax" min="1" max="61" step="1" value="61"></label>
      <label class="campo"><span>Distância do metrô/trem</span><output id="o-est"></output>
        <input type="range" id="f-est" min="200" max="2100" step="100" value="2100"></label>
      <label class="campo"><span>Máximo não residencial</span><output id="o-pnr"></output>
        <input type="range" id="f-pnr" min="0" max="100" step="10" value="50"></label>
      <label class="campo"><span>CA máximo dos prédios</span><output id="o-predio"></output>
        <input type="range" id="f-predio" min="0" max="4" step="0.5" value="4"></label>
      <label class="chave"><input type="checkbox" id="f-vila"><span></span>Só com vila</label>
      <label class="chave"><input type="checkbox" id="f-sem-alerta"><span></span>Só sem alertas</label>

      <h2>Cor</h2>
      <div class="segmento" id="modo-cor">
        <button type="button" data-modo="faixa" class="ativa">Área + forma</button>
        <button type="button" data-modo="faixa_area">Só área</button>
      </div>

      <h2>Mapa</h2>
      <div class="segmento" id="base">
        <button type="button" data-base="mapa" class="ativa">Ruas</button>
        <button type="button" data-base="satelite">Satélite</button>
      </div>
      <label class="chave"><input type="checkbox" data-camada="zonas" checked><span></span>Zoneamento</label>
      <label class="chave"><input type="checkbox" data-camada="tombados" checked><span></span>Bens tombados</label>
      <label class="chave"><input type="checkbox" data-camada="restricoes"><span></span>Restrições</label>
      <label class="chave"><input type="checkbox" data-camada="alertas"><span></span>Alertas</label>
      <label class="chave"><input type="checkbox" data-camada="estacoes" checked><span></span>Metrô e trem</label>

      <button id="btn-limpar" class="secundario" type="button">Restaurar filtros</button>
    </section>

    <section id="detalhe" hidden></section>
  </aside>

  <button id="alternar" type="button" aria-label="Mostrar ou ocultar painel">☰</button>
  <div id="aviso" hidden></div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="app.js?v=20251125b"></script>
</body>
</html>
